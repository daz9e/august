[package]
name = "august"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
croner = "4.0.1"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dialoguer = "0.12.0"
futures-util = "0.3.34"
getrandom = "0.4.3"
pulldown-cmark = "0.13.4"
ratatui = "0.30.2"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "form", "http2", "multipart"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.0", features = ["full"] }
tokio-util = "0.7.20"
unicode-width = "0.2.2"
