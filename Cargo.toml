[package]
name = "august"
version = "0.1.0"
edition = "2024"
default-run = "august"

[dependencies]
august-ext = { path = "extensions/sdk" }
anyhow = "1"
async-trait = "0.1"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
dotenvy = "0.15"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
getrandom = "0.3"
globset = "0.4.20"
ignore = "0.4.33"
regex = "1.13.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11.0"
tokio = { version = "1", features = ["full"] }

[[bin]]
name = "august"
path = "src/main.rs"

# Default extensions: each its own process, started by the gateway.
[[bin]]
name = "august-ext-browser"
path = "extensions/browser/main.rs"

[[bin]]
name = "august-ext-clarify"
path = "extensions/clarify/main.rs"

[[bin]]
name = "august-ext-goal"
path = "extensions/goal/main.rs"

[[bin]]
name = "august-ext-mcp"
path = "extensions/mcp/main.rs"

[[bin]]
name = "august-ext-subagents"
path = "extensions/subagents/main.rs"

[[bin]]
name = "august-ext-voice"
path = "extensions/voice/main.rs"

[[bin]]
name = "august-ext-web"
path = "extensions/web/main.rs"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
axum = "0.8"
tempfile = "3"

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[[test]]
name = "real"
path = "tests/real/main.rs"
