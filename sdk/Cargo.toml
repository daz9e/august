[package]
name = "august-ext"
version = "0.1.0"
edition = "2024"
description = "SDK for August extensions: the extension protocol over stdio"

[dependencies]
async-trait = "0.1"
base64 = "0.23.1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tokio = { version = "1", features = ["io-std", "io-util", "net", "process", "rt", "sync", "time"] }
